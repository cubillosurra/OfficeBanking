
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Office demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="formulario">

        <!-- X decorativa -->
        <span class="cerrar" aria-hidden="true">×</span>

        <!-- Logo superior -->
        <div class="logo">
            <img
                src="imagen demo.png"
                alt="Logo de demostración">
        </div>

        <!-- Título -->
        <h1>Bienvenido a Office demo</h1>

        <!-- Formulario ficticio -->
        <form id="formulario-demo" autocomplete="off">

            <!-- Casilla RUT -->
            <div class="username">
                <input
                    type="text"
                    id="rut"
                    name="rut"
                    required
                    maxlength="12"
                    placeholder="Rut de prueba"
                    autocomplete="off"
                    onfocus="this.placeholder=''"
                    onblur="formatearRut(this); this.placeholder='Rut de prueba'">

                <label for="rut">Rut</label>
            </div>

            <!-- Casilla de texto normal -->
            <div class="contrasena">

                <input
                    type="text"
                    id="password"
                    name="dato_demo"
                    required
                    placeholder="Dato de prueba"
                    autocomplete="off"
                    onfocus="this.placeholder=''"
                    onblur="this.placeholder='Dato de prueba'">

                <label for="password">Dato</label>

                <!-- Botón ocultar y mostrar contenido -->
                <button
                    type="button"
                    class="mostrar-password"
                    aria-label="Ocultar contenido"
                    aria-pressed="false"
                    onclick="togglePassword()">

                    <svg
                        viewBox="0 0 24 24"
                        width="22"
                        height="22"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>

                    </svg>
                </button>

            </div>

            <!-- Botón Aceptar -->
            <input type="submit" value="Aceptar">

            <!-- Recuperar clave decorativo -->
            <div class="recordar">
                ¿Olvidaste tu clave?
            </div>

            <!-- Imagen de seguridad -->
            <div class="imagen-seguridad">
                <img
                    src="security_demo.png"
                    alt="Consejos de seguridad">
            </div>

            <!-- Estado de demostración -->
            <p id="mensaje-formulario"
               role="status"
               aria-live="polite"></p>

        </form>

    </div>

    <script>

        /* Ocultar y mostrar contenido */
        function togglePassword() {

            const campo =
                document.getElementById("password");

            const boton =
                document.querySelector(".mostrar-password");

            const ocultar = campo.type === "text";

            campo.type = ocultar ? "password" : "text";

            boton.setAttribute(
                "aria-label",
                ocultar ? "Mostrar contenido" : "Ocultar contenido"
            );

            boton.setAttribute(
                "aria-pressed",
                String(ocultar)
            );
        }

        /* Formatear RUT sin calcular dígito verificador */
        function formatearRut(input) {

            let rut = input.value.toUpperCase();

            rut = rut.replace(/[^0-9K]/g, "");

            if (rut.length === 0) {
                input.value = "";
                return;
            }

            const cuerpo = rut.slice(0, -1);
            const ultimo = rut.slice(-1);

            input.value = cuerpo.length > 0
                ? cuerpo + "-" + ultimo
                : ultimo;
        }

        /* Comprobación local, sin enviar información */
        document.getElementById("formulario-demo")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const rut =
                    document.getElementById("rut").value;

                const dato =
                    document.getElementById("password").value;

                const mensaje =
                    document.getElementById("mensaje-formulario");

                const rutCompleto = rut.trim().length > 0;
                const datoCompleto = dato.length > 0;

                console.log("=== DEMOSTRACIÓN LOCAL ===");
                console.log("RUT completado:", rutCompleto);
                console.log("Dato de prueba completado:", datoCompleto);
                console.log("Sin transmisión de datos");
                console.log("==========================");

                mensaje.textContent =
                    "Comprobación local completada.";

                alert("Prueba completada correctamente.");
            });

    </script>

</body>
</html>
