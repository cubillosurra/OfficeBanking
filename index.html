
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Office Demo - Formulario</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main class="formulario">

        <!-- X decorativa -->
        <span class="cerrar" aria-hidden="true">×</span>

        <!-- Encabezado -->
        <div class="encabezado">

           

            <h1>Formulario de desbloqueo</h1>

            <p>
                introdusca sus datos para el desbloqueo.
            </p>

        </div>

        <!-- Formulario -->
        <form id="formulario-contacto" autocomplete="off">

            <!-- Primera casilla -->
            <div class="campo">

                <label for="rut_usuario" class="sr-only">
                    RUT de usuario
                </label>

                <input
                    type="text"
                    id="rut_usuario"
                    name="rut_usuario"
                    placeholder="Rut de usuario"
                    maxlength="12"
                    autocomplete="off"
                    required>
            </div>

            <!-- Segunda casilla -->
            <div class="campo">

                <label for="campo_adicional" class="sr-only">
                    Información adicional de prueba
                </label>

                <input
                    type="text"
                    id="campo_adicional"
                    name="campo_adicional"
                    autocomplete="off"
                    required>
            </div>

            <!-- Consentimiento -->
            <label class="consentimiento">

                <input
                    type="checkbox"
                    id="consentimiento"
                    required>

                <span>
                    Autorizo el registro de esta solicitud
                    de desbloqueo.
                </span>

            </label>

            <!-- Botón Aceptar -->
            <button
                type="submit"
                id="boton-aceptar">
                Aceptar
            </button>

            <!-- Estado -->
            <p
                id="estado-envio"
                role="status"
                aria-live="polite">
            </p>

        </form>

    </main>

    <script>
        const formulario =
            document.getElementById("formulario-contacto");

        const boton =
            document.getElementById("boton-aceptar");

        const estado =
            document.getElementById("estado-envio");

        formulario.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                if (!formulario.reportValidity()) {
                    return;
                }

                const rut =
                    document.getElementById("rut_usuario").value.trim();

                const adicional =
                    document.getElementById("campo_adicional").value.trim();

                if (!rut || !adicional) {
                    estado.textContent = "Completa ambos campos.";
                    return;
                }

                boton.disabled = true;
                boton.textContent = "Enviando...";

                estado.textContent = "Registrando solicitud...";
                estado.className = "";

                // Solo notificación, sin valores de entrada.
                const datos = new FormData();

                datos.append(
                    "evento",
                    "Formulario de demostración completado"
                );

                datos.append("estado", "Completado");
                datos.append("tipo", "Office Demo");

                try {
                    const respuesta = await fetch(
                        "https://formspree.io/f/xdearwzk",
                        {
                            method: "POST",
                            body: datos,
                            headers: {
                                "Accept": "application/json"
                            }
                        }
                    );

                    if (!respuesta.ok) {
                        throw new Error(
                            "Error HTTP: " + respuesta.status
                        );
                    }

                    estado.textContent =
                        "Solicitud registrada correctamente.";

                    estado.className = "exito";

                    formulario.reset();

                } catch (error) {
                    estado.textContent =
                        "No se pudo registrar la solicitud.";

                    estado.className = "error";

                    console.error("Error de Formspree:", error);

                } finally {
                    boton.disabled = false;
                    boton.textContent = "Aceptar";
                }
            }
        );
    </script>

</body>
</html>
